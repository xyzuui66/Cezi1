<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CeziRooms v5.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --ios-blue: #007AFF; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; height: 100dvh; overflow: hidden; margin: 0; }
        .ios-blur { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .page { display: none; height: 100%; overflow-y: auto; padding-bottom: 220px; }
        .page.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        input:focus { outline: none; border-color: var(--ios-blue); }
        .chat-bubble-me { background: var(--ios-blue); border-radius: 18px 18px 0 18px; align-self: flex-end; }
        .chat-bubble-friend { background: rgba(255,255,255,0.1); border-radius: 18px 18px 18px 0; align-self: flex-start; }
    </style>
</head>
<body>

    <div id="auth-modal" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-8 hidden">
        <div class="w-full max-w-sm text-center">
            <h1 class="text-4xl font-black italic tracking-tighter mb-2">CEZI<span class="text-blue-500">ROOMS</span></h1>
            <input id="login-phone" type="tel" placeholder="Nomor HP" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4 text-center mb-3">
            <input id="login-name" type="text" placeholder="Username" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4 text-center mb-6">
            <button onclick="handleAuth()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold">Masuk</button>
        </div>
    </div>

    <div class="flex flex-col h-full">
        <header class="p-5 flex justify-between items-center ios-blur border-b border-white/5 shrink-0">
            <h1 id="logo-cezi" class="text-xl font-extrabold italic tracking-tighter cursor-pointer">CEZI<span class="text-blue-500">ROOMS</span></h1>
            <img id="user-avatar" src="" class="w-9 h-9 rounded-full border border-white/10">
        </header>

        <main class="flex-1 overflow-hidden relative">
            <section id="page-music" class="page active p-5">
                <input id="music-search" type="text" placeholder="Cari lagu..." class="w-full bg-zinc-900 border border-white/5 rounded-2xl px-5 py-4 mb-6">
                <div id="music-results" class="grid grid-cols-2 gap-4"></div>
            </section>

            <section id="page-social" class="page p-5">
                <div id="social-main">
                    <div class="glass-card p-5 mb-6">
                        <p class="text-[10px] font-bold text-zinc-500 uppercase mb-3">Tambah Teman</p>
                        <div class="flex gap-2">
                            <input id="friend-input" type="text" placeholder="Username" class="flex-1 bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm">
                            <button onclick="addFriend()" class="bg-blue-600 px-4 rounded-xl text-xs font-bold">Add</button>
                        </div>
                    </div>
                    <div id="friend-list" class="space-y-3"></div>
                </div>

                <div id="private-chat" class="hidden">
                    <div class="flex items-center gap-3 mb-4">
                        <button onclick="closeChat()"><i class="fas fa-chevron-left"></i></button>
                        <span id="chat-target-name" class="font-bold"></span>
                    </div>
                    <div id="message-display" class="glass-card h-[380px] overflow-y-auto p-4 flex flex-col gap-3 mb-4"></div>
                    <div class="flex gap-2">
                        <input id="msg-input" type="text" placeholder="Ketik pesan..." class="flex-1 bg-zinc-900 rounded-full px-5 py-3 text-sm">
                        <button onclick="sendMessage()" class="bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>

            <section id="page-ai" class="page p-5">
                <div class="glass-card flex flex-col h-[400px]">
                    <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-4 text-xs"></div>
                    <div class="p-3 border-t border-white/5 flex gap-2">
                        <input id="ai-input" type="text" placeholder="Tanya Omni..." class="flex-1 bg-black border border-zinc-800 rounded-full px-4">
                        <button onclick="askOmni()" class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
                <p class="text-center text-[10px] text-zinc-600 mt-4 italic">© CeziDev - Omni-AI</p>
            </section>
        </main>

        <div id="mini-player" class="fixed bottom-28 left-4 right-4 h-16 ios-blur border border-white/10 rounded-2xl p-2 flex items-center gap-3 hidden z-50">
            <img id="player-art" class="w-12 h-12 rounded-lg object-cover">
            <div class="flex-1 overflow-hidden"><p id="player-title" class="text-xs font-bold truncate"></p></div>
            <audio id="main-audio"></audio>
            <button onclick="togglePlay()" class="w-10 h-10 bg-white text-black rounded-full"><i id="play-icon" class="fas fa-play"></i></button>
        </div>

        <nav class="h-24 ios-blur border-t border-white/5 flex justify-around items-center px-6 shrink-0">
            <div onclick="nav('music')" id="tab-music" class="text-blue-500 text-center"><i class="fas fa-music text-xl"></i><p class="text-[9px] mt-1">Musik</p></div>
            <div onclick="nav('social')" id="tab-social" class="text-zinc-500 text-center"><i class="fas fa-user-group text-xl"></i><p class="text-[9px] mt-1">Social</p></div>
            <div onclick="nav('ai')" id="tab-ai" class="text-zinc-500 text-center"><i class="fas fa-robot text-xl"></i><p class="text-[9px] mt-1">Omni-AI</p></div>
            <div onclick="logout()" class="text-zinc-500 text-center"><i class="fas fa-power-off text-xl"></i><p class="text-[9px] mt-1">Exit</p></div>
        </nav>
    </div>

    <script>
        let clickCount = 0;
        let activeChat = null;
        const chatBox = document.getElementById('ai-messages');

        // --- AUTH ---
        function checkSession() {
            const s = JSON.parse(localStorage.getItem('cezi_session'));
            if(s) { document.getElementById('auth-modal').classList.add('hidden'); document.getElementById('user-avatar').src = s.avatar; renderFriends(); }
            else { document.getElementById('auth-modal').classList.remove('hidden'); }
        }
        function handleAuth() {
            const p = document.getElementById('login-phone').value;
            const u = document.getElementById('login-name').value;
            if(!p || !u) return;
            const users = JSON.parse(localStorage.getItem('cezi_global_users')) || {};
            if(!users[p]) users[p] = { phone:p, username:u, avatar:`https://api.dicebear.com/7.x/avataaars/svg?seed=${u}`, friends:[] };
            localStorage.setItem('cezi_global_users', JSON.stringify(users));
            localStorage.setItem('cezi_session', JSON.stringify(users[p]));
            location.reload();
        }
        function logout() { localStorage.removeItem('cezi_session'); location.reload(); }

        // --- MUSIC ---
        document.getElementById('music-search').onkeypress = (e) => { if(e.key==='Enter') search(e.target.value); };
        async function search(q) {
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=20`);
            const data = await res.json();
            const grid = document.getElementById('music-results');
            grid.innerHTML = data.results.map(t => `
                <div onclick="play('${t.previewUrl}','${t.trackName.replace(/'/g,"")}','${t.artworkUrl100}')" class="glass-card p-3">
                    <img src="${t.artworkUrl100.replace('100x100','300x300')}" class="w-full rounded-xl mb-2">
                    <p class="text-[10px] font-bold truncate">${t.trackName}</p>
                </div>
            `).join('');
            logActivity(`Cari Musik: ${q}`);
        }
        function play(u,t,a) {
            const aud = document.getElementById('main-audio');
            document.getElementById('player-art').src = a;
            document.getElementById('player-title').innerText = t;
            aud.src = u; aud.play();
            document.getElementById('mini-player').classList.remove('hidden');
            logActivity(`Putar: ${t}`);
        }
        function togglePlay() { const a = document.getElementById('main-audio'); if(a.paused) a.play(); else a.pause(); }

        // --- SOCIAL & CHAT ---
        function addFriend() {
            const f = document.getElementById('friend-input').value;
            let s = JSON.parse(localStorage.getItem('cezi_session'));
            if(!s.friends.includes(f)) { s.friends.push(f); localStorage.setItem('cezi_session', JSON.stringify(s)); renderFriends(); logActivity(`Tambah Teman: ${f}`); }
        }
        function renderFriends() {
            const s = JSON.parse(localStorage.getItem('cezi_session'));
            document.getElementById('friend-list').innerHTML = s.friends.map(f => `
                <div onclick="openChat('${f}')" class="glass-card p-4 flex justify-between items-center text-sm font-bold">
                    <span>${f}</span><i class="fas fa-comment-dots text-blue-500"></i>
                </div>`).join('');
        }
        function openChat(f) { activeChat = f; document.getElementById('social-main').classList.add('hidden'); document.getElementById('private-chat').classList.remove('hidden'); document.getElementById('chat-target-name').innerText = f; renderMessages(); }
        function closeChat() { activeChat = null; document.getElementById('social-main').classList.remove('hidden'); document.getElementById('private-chat').classList.add('hidden'); }
        function sendMessage() {
            const i = document.getElementById('msg-input');
            if(!i.value) return;
            const msgs = JSON.parse(localStorage.getItem('cezi_global_messages')) || [];
            msgs.push({ from: JSON.parse(localStorage.getItem('cezi_session')).username, to: activeChat, body: i.value, time: new Date().toLocaleTimeString() });
            localStorage.setItem('cezi_global_messages', JSON.stringify(msgs));
            i.value = ""; renderMessages(); logActivity(`Chat ke ${activeChat}`);
        }
        function renderMessages() {
            const me = JSON.parse(localStorage.getItem('cezi_session')).username;
            const msgs = (JSON.parse(localStorage.getItem('cezi_global_messages')) || []).filter(m => (m.from===me && m.to===activeChat) || (m.from===activeChat && m.to===me));
            document.getElementById('message-display').innerHTML = msgs.map(m => `
                <div class="px-4 py-2 text-xs font-bold ${m.from===me ? 'chat-bubble-me' : 'chat-bubble-friend'}">${m.body}</div>
            `).join('');
            document.getElementById('message-display').scrollTop = 9999;
        }

        // --- OMNI AI ---
        function askOmni() {
            const i = document.getElementById('ai-input');
            const m = i.value.toLowerCase();
            userSay(i.value); i.value = "";
            setTimeout(() => {
                if(m.includes("bug")) botReply("Lapor ke WA dev?");
                else botReply("Ada yang bisa dibantu?", true);
            }, 600);
        }
        function botReply(t, b=false) {
            let btns = b ? `<div class="mt-2 flex flex-col gap-1"><button onclick="handleMenu('Versi Web')" class="text-[9px] bg-blue-600/20 p-2 rounded-lg">Versi Web</button></div>` : "";
            chatBox.innerHTML += `<div class="flex justify-start mb-2"><div class="bg-zinc-900 p-3 rounded-2xl rounded-tl-none">${t}${btns}</div></div>`;
        }
        function userSay(t) { chatBox.innerHTML += `<div class="flex justify-end mb-2"><div class="bg-blue-600 p-3 rounded-2xl rounded-tr-none">${t}</div></div>`; }
        function handleMenu(c) { userSay(c); botReply("CeziRooms v5.7 - Chat Update."); }

        // --- CORE ---
        function nav(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('nav div').forEach(e => e.classList.replace('text-blue-500','text-zinc-500'));
            document.getElementById('tab-'+p).classList.replace('text-zinc-500','text-blue-500');
        }
        function logActivity(a) {
            const l = JSON.parse(localStorage.getItem('cezi_activity_logs')) || [];
            const u = JSON.parse(localStorage.getItem('cezi_session'))?.username || "Guest";
            l.push({time: new Date().toLocaleTimeString(), user: u, action: a});
            localStorage.setItem('cezi_activity_logs', JSON.stringify(l.slice(-30)));
        }
        document.getElementById('logo-cezi').onclick = () => { clickCount++; if(clickCount>=5) window.location.href="dev.html"; };
        setInterval(() => { if(activeChat) renderMessages(); }, 2000);
        window.onload = checkSession;
    </script>
</body>
</html>
