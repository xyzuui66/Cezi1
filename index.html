<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CeziDev Master v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-black italic text-blue-500">DEV CONTROL</h1>
        
        <div class="card">
            <h2 class="text-xs font-bold uppercase text-zinc-500 mb-4">Server Status</h2>
            <div id="st-box" class="text-4xl font-black mb-4">LOADING...</div>
            <button onclick="toggleM()" id="st-btn" class="w-full py-4 rounded-xl font-bold uppercase text-xs transition active:scale-95"></button>
        </div>

        <div class="card">
            <h2 class="text-xs font-bold uppercase text-zinc-500 mb-2">Broadcast Update</h2>
            <input id="ann-t" type="text" placeholder="Judul" class="w-full bg-black border border-zinc-800 p-3 rounded-lg mb-2 outline-none">
            <textarea id="ann-m" placeholder="Isi pesan..." class="w-full bg-black border border-zinc-800 p-3 rounded-lg mb-3 outline-none"></textarea>
            <button onclick="sendAnn()" class="w-full bg-blue-600 py-3 rounded-lg font-bold text-[10px] uppercase">Publish Info</button>
        </div>
    </div>

    <script>
        const DB = "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app/";
        let isM = false;

        async function getStatus() {
            const r = await fetch(DB + "status.json");
            const d = await r.json();
            isM = d ? d.maintenance : false;
            
            const box = document.getElementById('st-box');
            const btn = document.getElementById('st-btn');
            
            box.innerText = isM ? "LOCKED" : "ACTIVE";
            box.className = isM ? "text-4xl font-black mb-4 text-red-600" : "text-4xl font-black mb-4 text-green-500";
            
            btn.innerText = isM ? "Buka Aplikasi" : "Kunci Aplikasi";
            btn.className = isM ? "w-full py-4 rounded-xl font-bold uppercase text-xs bg-green-600" : "w-full py-4 rounded-xl font-bold uppercase text-xs bg-red-600";
        }

        async function toggleM() {
            await fetch(DB + "status.json", { method:'PUT', body: JSON.stringify({ maintenance: !isM }) });
            getStatus();
        }

        async function sendAnn() {
            const t = document.getElementById('ann-t').value;
            const m = document.getElementById('ann-m').value;
            if(!t || !m) return alert("Isi data!");
            await fetch(DB + "announcement.json", { method:'POST', body: JSON.stringify({ title: t, message: m, time: Date.now() }) });
            alert("Terkirim!");
        }

        setInterval(getStatus, 2000);
        getStatus();
    </script>
</body>
</html>

            <div onclick="tab('update')" id="btn-update" class="text-zinc-500 flex-1 text-center cursor-pointer">
                <i class="fas fa-bullhorn text-lg"></i><p class="text-[7px] mt-1 font-black">INFO</p>
            </div>
        </nav>

    <div id="chat-ui" class="fixed inset-0 bg-black z-[100] hidden flex flex-col p-5 pt-12">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="closeChat()" class="text-zinc-500 p-2"><i class="fas fa-chevron-left text-xl"></i></button>
            <h2 id="chat-un" class="text-sm font-black italic text-blue-500 uppercase"></h2>
        </div>
        <div id="chat-box" class="flex-1 overflow-y-auto flex flex-col gap-3 p-2 no-scrollbar"></div>
        <div id="chat-input-area" class="flex gap-2 pb-8 mt-4">
            <input id="chat-in" type="text" placeholder="Ketik pesan..." class="flex-1 bg-zinc-900 rounded-2xl px-5 py-4 text-sm outline-none">
            <button onclick="sendMsg()" class="bg-blue-600 w-14 h-14 rounded-2xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
        </div>
        <p id="chat-lock-msg" class="hidden text-center text-zinc-700 text-[10px] font-black uppercase pb-10">Pesan Official (Hanya Baca)</p>
    </div>

    <script>
        const DB = "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app/";
        const IMG_KEY = "6798e826477e7cc42b826830f305c48b";
        let me = null, activeF = null;

        async function api(p, m='GET', b=null) {
            const o = { method: m }; if(b) o.body = JSON.stringify(b);
            const r = await fetch(DB + p + ".json", o); return await r.json();
        }

        // --- AUTH ---
        function checkSession() {
            const s = localStorage.getItem('cezi_user_v29');
            if(s) { me = JSON.parse(s); document.getElementById('my-av').src = me.avatar; startApp(); } 
            else { document.getElementById('auth-layer').classList.remove('hidden'); }
        }
        async function doLogin() {
            const ph = document.getElementById('in-phone').value.trim();
            const un = document.getElementById('in-un').value.trim();
            if(!ph || !un) return;
            me = { phone: ph, username: un.replace(/\s/g, ""), avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${un}`, friends: ["ADMIN_DEV"] };
            await api("users/" + ph, 'PUT', { username: me.username, phone: ph, avatar: me.avatar });
            localStorage.setItem('cezi_user_v29', JSON.stringify(me)); location.reload();
        }

        // --- MUSIC ENGINE v2.0 ---
        document.getElementById('m-q').onkeypress = async (e) => {
            if (e.key === 'Enter') {
                const q = e.target.value.trim(); if(!q) return;
                const res = document.getElementById('res-music');
                res.innerHTML = `<div class="col-span-2 py-10 text-center animate-pulse">Mencari...</div>`;
                const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&limit=20&entity=song`);
                const d = await r.json();
                res.innerHTML = d.results.map(t => `<div onclick="playMusic('${t.previewUrl}', '${t.trackName.replace(/'/g,"")}', '${t.artworkUrl100.replace('100x100','600x600')}')" class="glass p-3 active:scale-95 transition"><img src="${t.artworkUrl100.replace('100x100','400x400')}" class="w-full aspect-square rounded-xl mb-2 object-cover"><p class="text-[9px] font-black truncate uppercase">${t.trackName}</p></div>`).join('');
            }
        };
        function playMusic(u, t, a) {
            const ae = document.getElementById('ae'); ae.src = u; ae.play();
            document.getElementById('p-img').src = a; document.getElementById('p-txt').innerText = t;
            document.getElementById('player-bar').classList.remove('hidden');
            document.getElementById('p-ico').className = "fas fa-pause";
        }

        // --- AI ENGINE ---
        async function askAI() {
            const i = document.getElementById('ai-in'); if(!i.value.trim()) return;
            const b = document.getElementById('ai-box');
            const q = i.value; i.value = "";
            b.innerHTML += `<div class="bubble me">${q}</div>`;
            b.scrollTop = b.scrollHeight;
            
            try {
                // Menggunakan API Public untuk Chatbot Sederhana & Stabil
                const r = await fetch(`https://api.popcat.xyz/chatbot?msg=${encodeURIComponent(q)}&owner=CeziDev&botname=CeziAI`);
                const d = await r.json();
                b.innerHTML += `<div class="ai-bubble bubble">${d.response}</div>`;
            } catch {
                b.innerHTML += `<div class="ai-bubble bubble">Maaf, otak saya sedang panas. Coba lagi nanti!</div>`;
            }
            b.scrollTop = b.scrollHeight;
        }

        // --- STORY & SOCIAL ---
        async function upStory(el) {
            const file = el.files[0]; if(!file) return;
            document.getElementById('global-loader').style.display='flex';
            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            reader.onload = async (e) => {
                let url = e.target.result;
                if(!isVideo) {
                    const fd = new FormData(); fd.append("image", url.split(',')[1]);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_KEY}`, { method: 'POST', body: fd });
                    const d = await res.json(); url = d.data.url;
                }
                await new Promise(r => setTimeout(r, 2500));
                await api("stories", 'POST', { username: me.username, avatar: me.avatar, media: url, type: isVideo?'video':'image', time: Date.now() });
                document.getElementById('global-loader').style.display='none';
                loadStories();
            };
            reader.readAsDataURL(file);
        }

        async function loadStories() {
            const d = await api("stories"); if(!d) return;
            const now = Date.now();
            const valid = Object.values(d).filter(s => (now - s.time) < 86400000);
            document.getElementById('story-list').innerHTML = valid.reverse().map(s => `<div onclick="viewStory('${s.media}', '${s.username}', '${s.avatar}', '${s.type}')" class="flex-shrink-0 flex flex-col items-center gap-1"><div class="story-ring"><img src="${s.avatar}" class="w-16 h-16 rounded-full object-cover border-4 border-black"></div><span class="text-[8px] font-black uppercase text-zinc-500">${s.username}</span></div>`).join('');
        }

        // --- FRIEND & CHAT ---
        async function addF() {
            const q = document.getElementById('f-query').value.trim(); if(!q || q === me.username) return;
            const all = await api("users");
            const found = all ? Object.values(all).find(u => u.username.toLowerCase() === q.toLowerCase() || u.phone === q) : null;
            if(found && !me.friends.includes(found.username)) {
                me.friends.push(found.username);
                localStorage.setItem('cezi_user_v29', JSON.stringify(me));
                renderF(); alert("Teman ditambahkan!");
            } else { alert("User tidak ditemukan atau sudah berteman."); }
        }

        function renderF() {
            document.getElementById('res-friends').innerHTML = me.friends.map(f => `<div onclick="openChat('${f}')" class="bg-zinc-900/40 p-5 rounded-2xl flex justify-between items-center border border-white/5 active:bg-zinc-800 transition"><span class="text-xs font-black uppercase italic tracking-tighter">${f==='ADMIN_DEV'?'Official CeziDev':f}</span><i class="fas fa-chevron-right text-blue-500 text-[10px]"></i></div>`).join('');
        }

        function openChat(f) {
            activeF = f; document.getElementById('chat-un').innerText = f;
            document.getElementById('chat-ui').classList.remove('hidden');
            const isDev = (f === "ADMIN_DEV");
            document.getElementById('chat-input-area').classList.toggle('hidden', isDev);
            document.getElementById('chat-lock-msg').classList.toggle('hidden', !isDev);
            renderChat();
        }

        async function renderChat() {
            const data = await api("chats"); if(!data) return;
            const filtered = Object.values(data).filter(m => (m.from === me.username && m.to === activeF) || (m.from === activeF && m.to === me.username));
            const box = document.getElementById('chat-box');
            box.innerHTML = filtered.map(m => `<div class="bubble ${m.from === me.username ? 'me' : 'them'}">${m.body}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function sendMsg() {
            const i = document.getElementById('chat-in'); if(!i.value.trim()) return;
            await api("chats", 'POST', { from: me.username, to: activeF, body: i.value, time: Date.now() });
            i.value = ""; renderChat();
        }

        // --- NAVIGATION ---
        function tab(t) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-'+t).classList.add('active');
            document.querySelectorAll('nav div').forEach(d => d.classList.replace('text-blue-500','text-zinc-500'));
            document.getElementById('btn-'+t).classList.replace('text-zinc-500','text-blue-500');
        }

        async function syncApp() {
            const st = await api("server_status");
            document.getElementById('maint-layer').classList.toggle('hidden', !(st && st.maintenance));
            if(activeF) renderChat();
            loadStories();
            const ann = await api("announcement");
            if(ann) document.getElementById('res-ann').innerHTML = Object.values(ann).reverse().map(a => `<div class="glass p-5 border-l-4 border-blue-600 mb-4"><p class="text-[9px] font-black text-blue-500 mb-1 uppercase">Update</p><p class="text-sm font-bold mb-1">${a.title}</p><p class="text-[11px] text-zinc-500 font-medium">${a.message}</p></div>`).join('');
        }

        function startApp() { renderF(); syncApp(); setInterval(syncApp, 5000); }
        window.onload = checkSession;
        document.getElementById('logo-dev').onclick = () => { clickC++; if(clickC>=5) window.location.href="dev.html"; };
    </script>
</body>

    <div id="story-ui" class="fixed inset-0 z-[10000] bg-black hidden flex flex-col">
        <div class="absolute top-0 left-0 right-0 h-1 bg-zinc-900 flex gap-1 p-0.5">
            <div id="story-p-bg" class="flex-1 bg-zinc-800 rounded-full overflow-hidden"><div id="story-p-fill" class="h-full bg-white w-0"></div></div>
        </div>
        <div class="p-6 flex justify-between items-center z-50">
            <div class="flex items-center gap-3"><img id="story-av" class="w-10 h-10 rounded-full border border-white/20 object-cover"><span id="story-un" class="text-sm font-bold uppercase tracking-widest"></span></div>
            <button onclick="endStory()" class="text-white p-2"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div class="flex-1 flex items-center justify-center" id="story-media"></div>

    <script>
        const DB = "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app/";
        const IMG_KEY = "6798e826477e7cc42b826830f305c48b"; // Key ImgBB Anda
        let me = null, activeF = null, clickC = 0, storyInt;

        async function api(p, m='GET', b=null) {
            const o = { method: m }; if(b) o.body = JSON.stringify(b);
            const r = await fetch(DB + p + ".json", o); return await r.json();
        }

        // --- AUTH & SESSION ---
        function checkSession() {
            const s = localStorage.getItem('cezi_user_v25');
            if(s) { 
                me = JSON.parse(s); 
                document.getElementById('my-av').src = me.avatar;
                document.getElementById('auth-layer').classList.add('hidden');
                startApp();
            } else { document.getElementById('auth-layer').classList.remove('hidden'); }
        }

        async function doLogin() {
            const ph = document.getElementById('in-phone').value.trim();
            const un = document.getElementById('in-un').value.trim();
            if(!ph || !un) return;
            me = { phone: ph, username: un, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${un}`, friends: ["ADMIN_DEV"] };
            await api("users/" + ph, 'PUT', { username: un, phone: ph, avatar: me.avatar });
            localStorage.setItem('cezi_user_v25', JSON.stringify(me));
            location.reload();
        }

        // --- STORY SYSTEM (IMPROVED) ---
        async function upStory(el) {
            const file = el.files[0]; if(!file) return;
            const isVideo = file.type.startsWith('video/');
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                let mediaUrl = e.target.result;
                if(!isVideo) { // Jika gambar, upload ke ImgBB agar hemat storage Firebase
                    const fd = new FormData(); fd.append("image", mediaUrl.split(',')[1]);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_KEY}`, { method: 'POST', body: fd });
                    const d = await res.json(); mediaUrl = d.data.url;
                }
                await api("stories", 'POST', { username: me.username, avatar: me.avatar, media: mediaUrl, type: isVideo?'video':'image', time: Date.now() });
                loadStories();
            };
            reader.readAsDataURL(file);
        }

        async function loadStories() {
            const data = await api("stories"); if(!data) return;
            const now = Date.now();
            const validStories = Object.values(data).filter(s => (now - s.time) < 86400000);
            document.getElementById('story-list').innerHTML = validStories.map(s => `
                <div onclick="viewStory('${s.media}', '${s.username}', '${s.avatar}', '${s.type}')" class="flex-shrink-0 flex flex-col items-center gap-1">
                    <div class="story-ring"><img src="${s.avatar}" class="w-16 h-16 rounded-full object-cover border-2 border-black"></div>
                    <span class="text-[8px] font-black uppercase text-zinc-500">${s.username}</span>
                </div>`).join('');
        }

        function viewStory(m, u, a, t) {
            const ui = document.getElementById('story-ui'); ui.classList.remove('hidden');
            document.getElementById('story-un').innerText = u;
            document.getElementById('story-av').src = a;
            const box = document.getElementById('story-media');
            const progress = document.getElementById('story-p-fill');
            
            if(t === 'video') {
                box.innerHTML = `<video src="${m}" autoplay playsinline class="max-w-full max-h-[85vh]"></video>`;
                box.querySelector('video').ontimeupdate = (e) => {
                    progress.style.width = (e.target.currentTime / e.target.duration * 100) + "%";
                };
                box.querySelector('video').onended = () => endStory();
            } else {
                box.innerHTML = `<img src="${m}" class="max-w-full max-h-[85vh] object-contain">`;
                let w = 0; clearInterval(storyInt);
                storyInt = setInterval(() => { 
                    w += 1; progress.style.width = w + "%";
                    if(w >= 100) endStory();
                }, 50); // 5 Detik
            }
        }
        function endStory() { document.getElementById('story-ui').classList.add('hidden'); clearInterval(storyInt); }

        // --- MUSIC (PRECISION) ---
        document.getElementById('m-q').onkeypress = async (e) => {
            if (e.key === 'Enter') {
                const q = e.target.value.trim(); if(!q) return;
                const res = document.getElementById('res-music');
                res.innerHTML = `<div class="col-span-2 py-10 text-center animate-pulse"><i class="fas fa-circle-notch fa-spin text-blue-500 mb-2"></i><p class="text-[10px] font-black uppercase tracking-widest text-zinc-600">Syncing...</p></div>`;
                try {
                    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&limit=20&entity=song&attribute=mixTerm`);
                    const d = await r.json();
                    res.innerHTML = d.results.map(t => {
                        const art = t.artworkUrl100.replace('100x100bb.jpg', '500x500bb.jpg');
                        return `<div onclick="playMusic('${t.previewUrl}','${t.trackName.replace(/'/g,"")}','${art}')" class="glass p-3 active:scale-95 transition group">
                            <img src="${art}" class="w-full aspect-square rounded-xl mb-2 object-cover">
                            <p class="text-[9px] font-black truncate uppercase text-white">${t.trackName}</p>
                            <p class="text-[7px] font-bold text-zinc-600 truncate uppercase">${t.artistName}</p>
                        </div>`;
                    }).join('');
                } catch(err) { res.innerHTML = "Error loading music."; }
            }
        };

        function playMusic(u, t, a) {
            const ae = document.getElementById('ae'); ae.src = u; ae.play();
            document.getElementById('p-img').src = a; document.getElementById('p-txt').innerText = t;
            document.getElementById('player-bar').classList.remove('hidden');
            document.getElementById('p-ico').className = "fas fa-pause";
        }

        function ctrlMusic() {
            const ae = document.getElementById('ae');
            if(ae.paused) { ae.play(); document.getElementById('p-ico').className = "fas fa-pause text-xs"; }
            else { ae.pause(); document.getElementById('p-ico').className = "fas fa-play text-xs"; }
        }

        // --- CHAT & FRIENDS ---
        async function addF() {
            const q = document.getElementById('f-query').value.trim();
            const all = await api("users");
            const found = all ? Object.values(all).find(u => u.username === q || u.phone === q) : null;
            if(found && !me.friends.includes(found.username)) {
                me.friends.push(found.username);
                localStorage.setItem('cezi_user_v25', JSON.stringify(me));
                renderF(); alert("Teman ditambahkan!");
            }
            document.getElementById('f-query').value = "";
        }

        function renderF() {
            document.getElementById('res-friends').innerHTML = me.friends.map(f => `
                <div onclick="openChat('${f}')" class="bg-zinc-900/40 p-5 rounded-2xl flex justify-between items-center border border-white/5 active:scale-95 transition">
                    <span class="text-xs font-black uppercase italic tracking-tighter">${f==='ADMIN_DEV'?'Official CeziDev':f}</span>
                    <i class="fas fa-chevron-right text-blue-500 text-[10px]"></i>
                </div>`).join('');
        }

        function openChat(f) {
            activeF = f; document.getElementById('chat-un').innerText = f;
            document.getElementById('chat-ui').classList.remove('hidden');
            const isDev = (f === "ADMIN_DEV");
            document.getElementById('chat-input-area').classList.toggle('hidden', isDev);
            document.getElementById('chat-lock-msg').classList.toggle('hidden', !isDev);
            renderChat();
        }

        function closeChat() { activeF = null; document.getElementById('chat-ui').classList.add('hidden'); }

        async function renderChat() {
            const data = await api("chats"); if(!data) return;
            const filtered = Object.values(data).filter(m => (m.from === me.username && m.to === activeF) || (m.from === activeF && m.to === me.username));
            const box = document.getElementById('chat-box');
            box.innerHTML = filtered.map(m => `<div class="bubble ${m.from === me.username ? 'me' : 'them'} animate-up">${m.body}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function sendMsg() {
            const i = document.getElementById('chat-in'); if(!i.value.trim()) return;
            await api("chats", 'POST', { from: me.username, to: activeF, body: i.value, time: Date.now() });
            i.value = ""; renderChat();
        }

        // --- SYSTEM SYNC ---
        function tab(t) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-'+t).classList.add('active');
            document.querySelectorAll('nav div').forEach(d => d.classList.replace('text-blue-500','text-zinc-500'));
            document.getElementById('btn-'+t).classList.replace('text-zinc-500','text-blue-500');
        }

        async function syncApp() {
            const st = await api("server_status");
            document.getElementById('maint-layer').classList.toggle('hidden', !(st && st.maintenance));
            if(activeF) renderChat();
            loadStories();
            // Load Announcement
            const ann = await api("announcement");
            if(ann) document.getElementById('res-ann').innerHTML = Object.values(ann).reverse().map(a => `<div class="glass p-5 border-l-4 border-blue-600 shadow-xl"><p class="text-[10px] font-black text-blue-500 mb-1 uppercase tracking-widest">Update</p><p class="text-sm font-bold mb-1">${a.title}</p><p class="text-[11px] text-zinc-500 leading-relaxed font-medium">${a.message}</p></div>`).join('');
        }

        function startApp() {
            renderF(); syncApp(); setInterval(syncApp, 5000);
        }

        document.getElementById('logo-dev').onclick = () => { clickC++; if(clickC>=5) window.location.href="dev.html"; };
        window.onload = checkSession;
    </script>
</body>
</html>
