<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CeziRooms v5.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --ios-blue: #007AFF; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #fff; height: 100dvh; overflow: hidden; margin: 0; }
        .ios-blur { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .page { display: none; height: 100%; overflow-y: auto; padding-bottom: 200px; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input:focus { outline: none; border-color: var(--ios-blue); }
        .btn-ios { background: var(--ios-blue); color: white; padding: 12px; border-radius: 14px; font-weight: 700; transition: 0.2s; }
        .btn-ios:active { opacity: 0.7; transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="auth-modal" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-8 hidden">
        <div class="w-full max-w-sm text-center">
            <h1 class="text-4xl font-black italic tracking-tighter mb-2">CEZI<span class="text-blue-500">ROOMS</span></h1>
            <p class="text-zinc-500 text-sm mb-8">Data tersimpan permanen pada nomor HP Anda.</p>
            <input id="login-phone" type="tel" placeholder="Nomor HP (08...)" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4 text-center mb-3">
            <input id="login-name" type="text" placeholder="Username" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4 text-center mb-6">
            <button onclick="handleAuth()" class="w-full btn-ios shadow-lg">Mulai Sekarang</button>
        </div>
    </div>

    <div class="flex flex-col h-full">
        <header class="p-5 flex justify-between items-center ios-blur border-b border-white/5 shrink-0">
            <h1 id="logo-cezi" class="text-xl font-extrabold italic tracking-tighter cursor-pointer">CEZI<span class="text-blue-500">ROOMS</span></h1>
            <div class="flex items-center gap-3">
                <span id="nav-title" class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Musik</span>
                <img id="user-avatar" src="" class="w-9 h-9 rounded-full border border-white/10">
            </div>
        </header>

        <main class="flex-1 overflow-hidden relative">
            <section id="page-music" class="page active p-5">
                <div class="relative mb-6">
                    <input id="music-search" type="text" placeholder="Cari lagu..." class="w-full bg-zinc-900 border border-white/5 rounded-2xl px-5 py-4 pl-12">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                </div>
                <div id="music-results" class="grid grid-cols-2 gap-4"></div>
            </section>

            <section id="page-social" class="page p-5">
                <div class="glass-card p-5 mb-8">
                    <h3 class="text-xs font-bold text-zinc-500 uppercase mb-4">Tambah Teman Baru</h3>
                    <div class="flex gap-2">
                        <input id="friend-input" type="text" placeholder="Username / No HP" class="flex-1 bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm">
                        <button onclick="addFriend()" class="btn-ios py-0 px-6">Add</button>
                    </div>
                </div>
                <h3 class="text-xs font-bold text-zinc-500 uppercase mb-4">Daftar Teman</h3>
                <div id="friend-list" class="space-y-3">
                    <p class="text-center text-zinc-600 py-10 text-xs">Belum ada teman yang ditambahkan.</p>
                </div>
            </section>

            <section id="page-ai" class="page p-5">
                <div class="glass-card flex flex-col h-[450px]">
                    <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
                    <div class="p-3 border-t border-white/5 flex gap-2">
                        <input id="ai-input" type="text" placeholder="Pilih menu..." class="flex-1 bg-black border border-zinc-800 rounded-full px-5 py-2">
                        <button onclick="askOmni()" class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            </section>
        </main>

        <nav class="h-24 ios-blur border-t border-white/5 flex justify-around items-center px-6 shrink-0">
            <div onclick="nav('music')" id="tab-music" class="text-blue-500 text-center cursor-pointer"><i class="fas fa-music text-xl"></i><p class="text-[9px] mt-1 font-bold">Musik</p></div>
            <div onclick="nav('social')" id="tab-social" class="text-zinc-500 text-center cursor-pointer"><i class="fas fa-user-group text-xl"></i><p class="text-[9px] mt-1 font-bold">Social</p></div>
            <div onclick="nav('ai')" id="tab-ai" class="text-zinc-500 text-center cursor-pointer"><i class="fas fa-robot text-xl"></i><p class="text-[9px] mt-1 font-bold">Omni-AI</p></div>
            <div onclick="logout()" class="text-zinc-500 text-center cursor-pointer"><i class="fas fa-power-off text-xl"></i><p class="text-[9px] mt-1 font-bold">Exit</p></div>
        </nav>
    </div>

    <div id="mini-player" class="fixed bottom-28 left-4 right-4 h-16 ios-blur border border-white/10 rounded-2xl p-2 flex items-center gap-3 hidden z-50">
        <img id="player-art" class="w-12 h-12 rounded-lg object-cover">
        <div class="flex-1 overflow-hidden">
            <p id="player-title" class="text-xs font-bold truncate"></p>
            <p id="player-artist" class="text-[10px] text-zinc-500 truncate"></p>
        </div>
        <audio id="main-audio"></audio>
        <button onclick="togglePlay()" class="w-10 h-10 bg-white text-black rounded-full"><i id="play-icon" class="fas fa-play"></i></button>
    </div>

    <script>
        let clickCount = 0;
        const chatBox = document.getElementById('ai-messages');

        // --- AUTH ---
        function checkSession() {
            const session = JSON.parse(localStorage.getItem('cezi_session'));
            if (session) {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-avatar').src = session.avatar;
                renderFriends();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function handleAuth() {
            const phone = document.getElementById('login-phone').value.trim();
            const username = document.getElementById('login-name').value.trim();
            if (phone.length < 10 || !username) return alert("Lengkapi data!");
            const users = JSON.parse(localStorage.getItem('cezi_global_users')) || {};
            if (!users[phone]) {
                users[phone] = { phone, username, avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`, friends: [] };
            }
            localStorage.setItem('cezi_global_users', JSON.stringify(users));
            localStorage.setItem('cezi_session', JSON.stringify(users[phone]));
            location.reload();
        }

        function logout() { localStorage.removeItem('cezi_session'); location.reload(); }

        // --- SOCIAL SYSTEM (TAMBAH TEMAN) ---
        function addFriend() {
            const target = document.getElementById('friend-input').value.trim();
            if(!target) return;
            let session = JSON.parse(localStorage.getItem('cezi_session'));
            let users = JSON.parse(localStorage.getItem('cezi_global_users'));

            if (!session.friends.includes(target)) {
                session.friends.push(target);
                users[session.phone] = session; // Update ke DB global
                localStorage.setItem('cezi_global_users', JSON.stringify(users));
                localStorage.setItem('cezi_session', JSON.stringify(session));
                document.getElementById('friend-input').value = "";
                renderFriends();
                logActivity(`Menambah teman: ${target}`);
                alert("Teman berhasil ditambahkan secara permanen!");
            } else { alert("Sudah berteman!"); }
        }

        function renderFriends() {
            const list = document.getElementById('friend-list');
            const session = JSON.parse(localStorage.getItem('cezi_session'));
            if (!session.friends || session.friends.length === 0) return;
            list.innerHTML = session.friends.map(f => `
                <div class="glass-card p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3 text-sm">
                        <div class="w-8 h-8 bg-blue-500/20 rounded-full flex items-center justify-center text-blue-500 text-[10px] font-bold">${f.charAt(0).toUpperCase()}</div>
                        <div><p class="font-bold">${f}</p><p class="text-[9px] text-green-500 font-bold uppercase tracking-tighter">● Online</p></div>
                    </div>
                    <i class="fas fa-comment text-zinc-600"></i>
                </div>
            `).join('');
        }

        // --- OMNI-AI MENU ---
        function askOmni() {
            const input = document.getElementById('ai-input');
            const msg = input.value.trim().toLowerCase();
            if(!msg) return;
            userSay(input.value); input.value = "";
            setTimeout(() => {
                if(msg.includes("web")) handleMenu('Versi Web');
                else if(msg.includes("dev")) handleMenu('Tentang Dev');
                else if(msg.includes("bug")) handleMenu('Laporkan Bug');
                else botReply("Silakan pilih menu bantuan:", true);
            }, 600);
        }

        function botReply(text, showButtons = false) {
            let btns = showButtons ? `<div class="flex flex-col gap-2 mt-3">
                <button onclick="handleMenu('Versi Web')" class="bg-blue-600/20 text-blue-500 border border-blue-500/30 py-2 rounded-xl text-xs font-bold">Versi Web</button>
                <button onclick="handleMenu('Tentang Dev')" class="bg-blue-600/20 text-blue-500 border border-blue-500/30 py-2 rounded-xl text-xs font-bold">Tentang Dev</button>
                <button onclick="handleMenu('Laporkan Bug')" class="bg-red-500/20 text-red-500 border border-red-500/30 py-2 rounded-xl text-xs font-bold">Laporkan Bug</button>
            </div>` : "";
            chatBox.innerHTML += `<div class="flex justify-start mb-4"><div class="bg-zinc-900 border border-white/5 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm">${text}${btns}</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function userSay(t) {
            chatBox.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-blue-600 px-4 py-2 rounded-2xl rounded-tr-none text-sm max-w-[85%]">${t}</div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            logActivity(`Chat: ${t}`);
        }

        function handleMenu(c) {
            if(event) userSay(c);
            setTimeout(() => {
                if(c==='Versi Web') botReply("🚀 **CeziRooms v5.5**<br>Update: 30 Des 2025. Data Akun Aman.");
                else if(c==='Tentang Dev') botReply("👨‍💻 **Dev:** CeziDev. Musik & Social tanpa iklan.");
                else if(c==='Laporkan Bug') {
                    botReply("Klik tombol di bawah:");
                    chatBox.innerHTML += `<div class="mb-4"><a href="https://wa.me/6285830654340?text=Lapor%20Bug" target="_blank" onclick="logActivity('Lapor Bug')" class="bg-green-600 px-4 py-3 rounded-xl text-xs font-bold block text-center">Hubungi WA Dev</a></div>`;
                }
                setTimeout(() => botReply("Ada lagi?", true), 1000);
            }, 500);
        }

        // --- UTILS ---
        function nav(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(e => { e.classList.remove('text-blue-500'); e.classList.add('text-zinc-500'); });
            document.getElementById('page-'+p).classList.add('active');
            document.getElementById('tab-'+p).classList.replace('text-zinc-500', 'text-blue-500');
            document.getElementById('nav-title').innerText = p;
            if(p === 'ai' && chatBox.innerHTML === "") botReply("Halo! Apa yang ingin kamu ketahui?", true);
        }

        function logActivity(act) {
            const logs = JSON.parse(localStorage.getItem('cezi_activity_logs')) || [];
            const sess = JSON.parse(localStorage.getItem('cezi_session')) || {username:"Guest", phone:"N/A"};
            logs.push({time: new Date().toLocaleTimeString(), user: sess.username, phone: sess.phone, action: act});
            localStorage.setItem('cezi_activity_logs', JSON.stringify(logs));
        }

        document.getElementById('logo-cezi').onclick = () => {
            clickCount++;
            if(clickCount >= 5) window.location.href = "dev.html";
            setTimeout(() => clickCount = 0, 3000);
        };

        window.onload = checkSession;
    </script>
</body>
</html>
