<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CeziDev - Titanium Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#050505] text-white p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12 bg-zinc-900/40 p-10 rounded-[48px] border border-white/5 shadow-2xl">
            <div>
                <h1 class="text-3xl font-black italic uppercase tracking-tighter">Cezi<span class="text-blue-500">Dev</span></h1>
                <p class="text-[10px] font-black text-blue-500 uppercase tracking-[0.4em] mt-2">Titanium Cloud Monitor Active</p>
            </div>
            <div class="flex gap-4">
                <button onclick="setStatus('maintenance', true)" class="bg-red-600/10 text-red-500 border border-red-500/20 px-8 py-4 rounded-3xl text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition shadow-xl">Lock Server</button>
                <button onclick="setStatus('maintenance', false)" class="bg-blue-600 px-8 py-4 rounded-3xl text-[10px] font-black uppercase shadow-xl shadow-blue-600/20 active:scale-95 transition">Unlock Server</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-zinc-900/20 p-10 rounded-[48px] border border-white/5">
                <h2 class="text-blue-500 font-black text-xs uppercase mb-8 tracking-widest"><i class="fas fa-satellite-dish mr-2"></i> Push Real-time Broadcast</h2>
                <textarea id="dev-msg" placeholder="Ketik pesan broadcast satu arah untuk 1000+ user..." class="w-full bg-black/50 p-8 rounded-[32px] border border-white/10 outline-none font-bold text-sm h-48 focus:border-blue-500 transition shadow-inner"></textarea>
                <div class="flex gap-4 mt-8">
                    <button onclick="sendDevBroadcast()" class="flex-1 bg-blue-600 py-6 rounded-3xl font-black uppercase text-xs shadow-xl active:scale-95 transition">Kirim ke Semua User Sekarang</button>
                    <button onclick="clearBroadcast()" class="bg-zinc-800 px-8 py-6 rounded-3xl font-black uppercase text-[10px] text-zinc-500">Clear</button>
                </div>
            </div>

            <div class="bg-zinc-900/20 p-10 rounded-[48px] border border-white/5">
                <h2 class="text-zinc-500 font-black text-xs uppercase mb-8 tracking-widest">Active Hits Log</h2>
                <div id="log-res" class="space-y-4 max-h-[400px] overflow-y-auto no-scrollbar">
                    <p class="text-[10px] font-black text-zinc-700 animate-pulse uppercase">Menunggu trafik...</p>
                </div>
            </div>

            <div class="lg:col-span-3 bg-zinc-900/20 p-10 rounded-[48px] border border-blue-500/10 mt-4">
                <h2 class="text-blue-500 font-black text-xs uppercase mb-8 tracking-widest">Registered Global Users</h2>
                <div id="user-db-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app/";

        async function setStatus(k, v) {
            await fetch(`${API}status/${k}.json`, { method: 'PUT', body: JSON.stringify(v) });
            alert("System Status Updated!");
        }

        async function sendDevBroadcast() {
            const m = document.getElementById('dev-msg').value;
            if(!m) return alert("Pesan kosong!");
            await fetch(`${API}broadcast.json`, { 
                method: 'POST', 
                body: JSON.stringify({ msg: m, time: new Date().toLocaleTimeString() })
            });
            document.getElementById('dev-msg').value = '';
            alert("Broadcast Terkirim Real-time!");
        }

        async function clearBroadcast() {
            await fetch(`${API}broadcast.json`, { method: 'DELETE' });
            alert("Broadcast dihapus!");
        }

        const syncDev = async () => {
            try {
                const r = await fetch(`${API}.json`);
                const d = await r.json();
                if(!d) return;

                // Sync IP Logs
                if(d.user_logs) {
                    const logs = Object.values(d.user_logs).reverse().slice(0, 10);
                    document.getElementById('log-res').innerHTML = logs.map(l => `
                        <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
                            <p class="text-[9px] font-black text-blue-500 uppercase">${l.u}</p>
                            <p class="text-[10px] font-mono text-zinc-400 mt-1">${l.ip}</p>
                            <p class="text-[7px] text-zinc-600 mt-2 font-bold">${l.loc} • ${l.t}</p>
                        </div>`).join('');
                }

                // Sync Registered Users
                if(d.users) {
                    document.getElementById('user-db-list').innerHTML = Object.values(d.users).map(u => `
                        <div class="bg-black/60 p-4 rounded-3xl text-center border border-white/5">
                            <img src="${u.avatar}" class="w-12 h-12 rounded-full mx-auto mb-3 border border-white/10">
                            <p class="text-[9px] font-black uppercase text-white truncate">${u.name}</p>
                            <p class="text-[7px] text-zinc-600 font-bold">${u.phone}</p>
                        </div>`).join('');
                }
            } catch(e) {}
        };

        setInterval(syncDev, 5000);
        syncDev();
    </script>
</body>
</html>
