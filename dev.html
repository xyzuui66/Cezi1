<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CeziDev v5.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background:#000; color:#fff; }</style>
</head>
<body class="p-6 font-mono">
    <div class="flex justify-between items-center mb-10">
        <h1 class="text-xl font-bold text-blue-500 italic">CEZIDEV_DASHBOARD_5.7</h1>
        <div class="text-[10px] bg-blue-600/20 px-4 py-2 rounded-full">Total Messages: <span id="total-msgs">0</span></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-zinc-900 p-6 rounded-3xl h-[500px] overflow-y-auto">
            <p class="text-[10px] text-zinc-500 mb-4 font-bold uppercase">Live Activity</p>
            <div id="log-list" class="space-y-2 text-[10px]"></div>
        </div>
        <div class="bg-zinc-900 p-6 rounded-3xl h-[500px] overflow-y-auto">
            <p class="text-[10px] text-zinc-500 mb-4 font-bold uppercase">Users & Social Traffic</p>
            <div id="user-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        function sync() {
            const logs = JSON.parse(localStorage.getItem('cezi_activity_logs')) || [];
            const users = JSON.parse(localStorage.getItem('cezi_global_users')) || {};
            const msgs = JSON.parse(localStorage.getItem('cezi_global_messages')) || [];

            document.getElementById('total-msgs').innerText = msgs.length;

            document.getElementById('log-list').innerHTML = logs.slice().reverse().map(l => `
                <div class="border-b border-white/5 py-1">
                    <span class="text-zinc-600">[${l.time}]</span> <span class="text-blue-400">${l.user}</span>: ${l.action}
                </div>
            `).join('');

            document.getElementById('user-list').innerHTML = Object.values(users).map(u => `
                <div class="bg-black/50 p-4 rounded-xl border border-white/5">
                    <p class="font-bold text-sm mb-2 text-blue-500">${u.username}</p>
                    <div class="flex flex-wrap gap-1">
                        ${u.friends.map(f => `<span class="bg-zinc-800 px-2 py-1 rounded text-[8px]">${f}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }
        setInterval(sync, 2000);
        sync();
    </script>
</body>
</html>
