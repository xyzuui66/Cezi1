<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CeziDev Control v6.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background:#050505; color:#eee; font-family: 'Inter', sans-serif; }
        .admin-card { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-10">
    <header class="flex justify-between items-center mb-10">
        <div>
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">CEZIDEV <span class="text-white">PRO</span></h1>
            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Database Control Center v6.1</p>
        </div>
        <button onclick="clearAllData()" class="bg-red-500/10 text-red-500 text-[10px] font-bold px-4 py-2 rounded-full border border-red-500/20 hover:bg-red-500 hover:text-white transition">WIPE DATABASE</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="admin-card p-6 h-fit">
            <h2 class="text-xs font-bold text-blue-500 mb-6 uppercase tracking-widest"><i class="fas fa-bullhorn mr-2"></i> Global Broadcast</h2>
            <div class="space-y-4">
                <input id="ann-title" type="text" placeholder="Judul Update" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none">
                <textarea id="ann-msg" placeholder="Pesan untuk semua user..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm h-28 focus:border-blue-500 outline-none"></textarea>
                <button onclick="sendAnnounce()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold shadow-lg shadow-blue-600/20 transition">Siarkan Sekarang</button>
            </div>
        </div>

        <div class="admin-card p-6 lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-bold text-green-500 uppercase tracking-widest"><i class="fas fa-comments mr-2"></i> Live Chat Monitor</h2>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] text-zinc-500 font-bold uppercase">Real-time Encrypted</span>
                </div>
            </div>
            
            <div id="chat-monitor" class="space-y-3 h-[500px] overflow-y-auto pr-2">
                <p class="text-center text-zinc-700 mt-20 text-sm italic">Menghubungkan ke server...</p>
            </div>
        </div>

    </div>

    <script>
        const BASE_DB = "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app/";
        
        // --- BROADCAST SYSTEM ---
        async function sendAnnounce() {
            const t = document.getElementById('ann-title').value;
            const m = document.getElementById('ann-msg').value;
            if(!t || !m) return alert("Harap isi semua kolom!");

            const data = { title: t, message: m, time: new Date().toLocaleString('id-ID'), timestamp: Date.now() };

            try {
                await fetch(BASE_DB + "announcement.json", { method: 'PUT', body: JSON.stringify(data) });
                alert("Pengumuman berhasil dikirim!");
                document.getElementById('ann-title').value = "";
                document.getElementById('ann-msg').value = "";
            } catch(e) { alert("Error koneksi!"); }
        }

        // --- MESSAGE MONITOR SYSTEM ---
        async function fetchChats() {
            try {
                const res = await fetch(BASE_DB + "chats.json");
                const data = await res.json();
                const container = document.getElementById('chat-monitor');

                if(!data) {
                    container.innerHTML = `<div class="text-center py-20 text-zinc-700 text-xs italic">Belum ada aktivitas percakapan.</div>`;
                    return;
                }

                const chatArray = Object.values(data).reverse(); // Pesan terbaru di atas
                
                container.innerHTML = chatArray.map(c => `
                    <div class="bg-zinc-900/50 border border-white/5 p-4 rounded-2xl hover:border-blue-500/30 transition">
                        <div class="flex justify-between mb-2 text-[10px]">
                            <span class="font-black text-blue-400">FROM: ${c.from}</span>
                            <span class="font-black text-purple-400">TO: ${c.to}</span>
                        </div>
                        <div class="bg-black/50 p-3 rounded-lg border border-zinc-800 flex items-center justify-between">
                            <p class="text-xs text-zinc-300 font-medium">
                                <i class="fas fa-lock text-[8px] mr-2 text-zinc-600"></i>
                                ${c.body}
                            </p>
                            <span class="text-[8px] text-zinc-600">${c.time}</span>
                        </div>
                    </div>
                `).join('');

            } catch(e) { console.error("Monitor Error"); }
        }

        async function clearAllData() {
            if(confirm("PERINGATAN: Ini akan menghapus SEMUA chat dan pengumuman! Lanjutkan?")) {
                await fetch(BASE_DB + ".json", { method: 'DELETE' });
                location.reload();
            }
        }

        // Jalankan Monitor setiap 3 detik
        setInterval(fetchChats, 3000);
        fetchChats();
    </script>
</body>
</html>
