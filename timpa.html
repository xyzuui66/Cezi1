<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vnioapp Uji Coba - TikTok Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }

        /* HEADER VNIO (Penyamaran Nama) */
        #vnio-top-bar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #vnio-top-bar h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
        }

        #vnio-top-bar span { color: #3b82f6; } /* Warna Biru Vnio */

        /* CONTAINER UTAMA */
        #main-engine {
            width: 100%;
            height: 100vh;
            padding-top: 60px; /* Supaya konten tiktok gak ketutup header vnio */
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Memaksa konten menyesuaikan layar hp */
        }

        /* LOADING ANIMASI VNIO */
        #vnio-loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: 0.8s ease-in-out;
        }

        .loader-logo {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* NAVBAR BAWAH PALSU (Agar vibe Vnioapp makin kuat) */
        #vnio-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 65px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-icon { color: #888; font-size: 20px; }
        .nav-active { color: #fff; }
    </style>
</head>
<body>

    <div id="vnio-loader">
        <div class="loader-logo">VNIO<span>APP</span></div>
        <p class="text-zinc-500 text-[10px] mt-4 uppercase tracking-[4px]">Inisialisasi Engine...</p>
    </div>

    <header id="vnio-top-bar">
        <h1>VNIO<span>APP</span></h1>
        <div class="ml-auto flex gap-4 items-center">
            <i class="fas fa-search text-white"></i>
            <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700"></div>
        </div>
    </header>

    <div id="main-engine">
        <iframe 
            id="engine-frame"
            src="https://www.tiktok.com/foryou" 
            allow="autoplay; encrypted-media; clipboard-write; feedback"
            allowfullscreen>
        </iframe>
    </div>

    <nav id="vnio-nav">
        <i class="fas fa-home nav-icon nav-active"></i>
        <i class="fas fa-users nav-icon"></i>
        <div class="w-12 h-8 bg-white rounded-lg flex items-center justify-center text-black">
            <i class="fas fa-plus"></i>
        </div>
        <i class="fas fa-comment-dots nav-icon"></i>
        <i class="fas fa-user nav-icon"></i>
    </nav>

    <script>
        const frame = document.getElementById('engine-frame');
        const loader = document.getElementById('vnio-loader');

        // Logic Hilangkan Loader saat TikTok Siap
        frame.onload = function() {
            setTimeout(() => {
                loader.style.transform = "translateY(-100%)";
                setTimeout(() => loader.style.display = "none", 800);
            }, 2500); // Memberi waktu tiktok loading di belakang
        };

        // Memastikan Sesi Tetap Ada (Sesuai Saved Info kamu)
        // Kita gunakan localStorage untuk proteksi sederhana
        if (localStorage.getItem('vnio_session_active')) {
            console.log("Sesi Vnio Terdeteksi: Akun Aman.");
        } else {
            localStorage.setItem('vnio_session_active', 'true');
        }

        // Mencegah penutupan aplikasi secara tidak sengaja
        window.onbeforeunload = function() {
            return "Vnioapp sedang berjalan, yakin ingin keluar?";
        };
    </script>
</body>
</html>
