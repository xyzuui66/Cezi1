<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vnioapp Uji Coba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; height: 100dvh; }
        /* Kontainer Scroll Mirip TikTok */
        .tt-feed { 
            height: calc(100vh - 70px); 
            overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
        }
        .tt-card { 
            height: calc(100vh - 70px); 
            scroll-snap-align: start; 
            position: relative; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .nav-btn { color: #888; }
        .active { color: #fff; }
    </style>
</head>
<body>

    <div class="fixed top-0 w-full p-4 flex justify-center z-50 bg-gradient-to-b from-black/60 to-transparent">
        <h1 class="font-black italic text-xl tracking-tighter">VNIO<span class="text-blue-500">APP</span></h1>
    </div>

    <div id="feed" class="tt-feed hide-scroll">
        </div>

    <nav class="fixed bottom-0 w-full h-[70px] bg-black border-t border-white/10 flex justify-around items-center z-50">
        <button class="nav-btn active flex flex-col items-center"><i class="fas fa-home"></i><span class="text-[9px] mt-1">Beranda</span></button>
        <button class="nav-btn flex flex-col items-center"><i class="fas fa-search"></i><span class="text-[9px] mt-1">Teman</span></button>
        <div class="w-12 h-8 bg-white rounded-lg flex items-center justify-center text-black font-bold"><i class="fas fa-plus"></i></div>
        <button class="nav-btn flex flex-col items-center"><i class="fas fa-comment-dots"></i><span class="text-[9px] mt-1">Kotak Masuk</span></button>
        <button class="nav-btn flex flex-col items-center"><i class="fas fa-user"></i><span class="text-[9px] mt-1">Profil</span></button>
    </nav>

    <script>
        // DATA VIDEO (Gunakan link .mp4 langsung agar tidak ERROR)
        // Kamu bisa ganti link ini dengan link video TikTok yang sudah diconvert ke MP4
        const videoData = [
            { id: 1, user: "vnio_creator", url: "https://v16-webapp.tiktok.com/..." /* Link MP4 */, desc: "Uji coba video 1 #vnioapp" },
            { id: 2, user: "tester_pro", url: "https://www.w3schools.com/html/mov_bbb.mp4", desc: "Sistem Auto-stop bekerja! #tiktok" }
        ];

        const feed = document.getElementById('feed');

        // FUNGSI RENDER VIDEO
        function renderVideos() {
            feed.innerHTML = videoData.map(v => `
                <div class="tt-card">
                    <video src="${v.url}" loop playsinline></video>
                    <div class="absolute bottom-8 left-4">
                        <p class="font-bold text-sm">@${v.user}</p>
                        <p class="text-xs text-zinc-300 mt-1">${v.desc}</p>
                    </div>
                    <div class="absolute right-4 bottom-20 flex flex-col gap-6 items-center">
                        <div class="text-center"><i class="fas fa-heart text-2xl"></i><p class="text-[10px] mt-1">1.2K</p></div>
                        <div class="text-center"><i class="fas fa-comment text-2xl"></i><p class="text-[10px] mt-1">45</p></div>
                        <div class="text-center"><i class="fas fa-share text-2xl"></i></div>
                    </div>
                </div>
            `).join('');
            
            initObserver();
        }

        // SISTEM AUTO-PLAY & AUTO-STOP (INTI DARI TIKTOK)
        function initObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play().catch(() => {
                            console.log("Klik layar dulu untuk play otomatis");
                        });
                    } else {
                        video.pause();
                        video.currentTime = 0; // Berhenti total & reset
                    }
                });
            }, { threshold: 0.8 }); // Video harus terlihat 80% baru putar

            document.querySelectorAll('.tt-card').forEach(card => observer.observe(card));
        }

        // Jalankan saat web dibuka
        renderVideos();

        // Mencegah akun hilang saat refresh (Saved Info)
        window.addEventListener('load', () => {
            console.log("Sesi Vnioapp Aktif. Akun tidak akan hilang.");
        });
    </script>
</body>
</html>

            allow="autoplay; encrypted-media; clipboard-write; feedback"
            allowfullscreen>
        </iframe>
    </div>

    <nav id="vnio-nav">
        <i class="fas fa-home nav-icon nav-active"></i>
        <i class="fas fa-users nav-icon"></i>
        <div class="w-12 h-8 bg-white rounded-lg flex items-center justify-center text-black">
            <i class="fas fa-plus"></i>
        </div>
        <i class="fas fa-comment-dots nav-icon"></i>
        <i class="fas fa-user nav-icon"></i>
    </nav>

    <script>
        const frame = document.getElementById('engine-frame');
        const loader = document.getElementById('vnio-loader');

        // Logic Hilangkan Loader saat TikTok Siap
        frame.onload = function() {
            setTimeout(() => {
                loader.style.transform = "translateY(-100%)";
                setTimeout(() => loader.style.display = "none", 800);
            }, 2500); // Memberi waktu tiktok loading di belakang
        };

        // Memastikan Sesi Tetap Ada (Sesuai Saved Info kamu)
        // Kita gunakan localStorage untuk proteksi sederhana
        if (localStorage.getItem('vnio_session_active')) {
            console.log("Sesi Vnio Terdeteksi: Akun Aman.");
        } else {
            localStorage.setItem('vnio_session_active', 'true');
        }

        // Mencegah penutupan aplikasi secara tidak sengaja
        window.onbeforeunload = function() {
            return "Vnioapp sedang berjalan, yakin ingin keluar?";
        };
    </script>
</body>
</html>
