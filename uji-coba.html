<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vnioapp - TikTok Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; height: 100dvh; overflow: hidden; margin: 0; }
        .page { display: none; height: 100%; }
        .page.active { display: block; }
        
        /* TikTok Video Layout */
        .tt-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - 65px); scroll-behavior: smooth; }
        .tt-video-card { scroll-snap-align: start; height: calc(100vh - 65px); position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* TikTok Settings Bottom Sheet */
        .settings-sheet { transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .settings-sheet.show { transform: translateY(0); }
        
        .nav-btn { color: #888; transition: 0.2s; }
        .nav-btn.active { color: #fff; }
        .profile-stat { text-align: center; }
        .profile-stat p:first-child { font-weight: 800; font-size: 18px; }
        .profile-stat p:last-child { font-size: 11px; color: #888; }
    </style>
</head>
<body>

    <main class="h-full">
        <section id="page-home" class="page active">
            <div id="tt-feed" class="tt-container hide-scroll">
                </div>
        </section>

        <section id="page-profile" class="page bg-black overflow-y-auto">
            <div class="p-4 flex justify-between items-center border-b border-white/5">
                <i class="fas fa-user-plus"></i>
                <span class="font-bold text-sm" id="user-display">Username</span>
                <i onclick="toggleSettings()" class="fas fa-bars text-xl cursor-pointer"></i>
            </div>
            
            <div class="p-6 flex flex-col items-center">
                <img id="profile-img" class="w-24 h-24 rounded-full border-2 border-white/10 mb-4 object-cover">
                <p class="font-bold text-md">@<span id="user-handle">user</span></p>
                
                <div class="flex gap-8 my-6">
                    <div class="profile-stat"><p>0</p><p>Mengikuti</p></div>
                    <div class="profile-stat"><p>1.2M</p><p>Pengikut</p></div>
                    <div class="profile-stat"><p>10M</p><p>Suka</p></div>
                </div>

                <div class="flex gap-2 w-full px-4">
                    <button class="flex-1 bg-[#252525] py-2 rounded-md font-bold text-sm">Edit profil</button>
                    <button class="bg-[#252525] px-4 py-2 rounded-md"><i class="fas fa-share"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-0.5 border-t border-white/5 mt-4">
                <div class="aspect-[3/4] bg-zinc-900 flex items-center justify-center"><i class="fas fa-lock text-zinc-700"></i></div>
                <div class="aspect-[3/4] bg-zinc-900"></div>
                <div class="aspect-[3/4] bg-zinc-900"></div>
            </div>
        </section>
    </main>

    <div id="settings-overlay" onclick="toggleSettings()" class="fixed inset-0 bg-black/60 z-[100] hidden"></div>
    <div id="settings-menu" class="fixed bottom-0 left-0 right-0 bg-[#121212] z-[101] rounded-t-2xl p-4 settings-sheet">
        <div class="w-10 h-1 bg-zinc-700 mx-auto rounded-full mb-6"></div>
        <h3 class="font-bold text-center mb-6">Pengaturan dan privasi</h3>
        <div class="space-y-1">
            <div class="flex items-center gap-4 p-4 hover:bg-white/5 rounded-xl"><i class="fas fa-user"></i> <span>Kelola akun</span></div>
            <div class="flex items-center gap-4 p-4 hover:bg-white/5 rounded-xl"><i class="fas fa-lock"></i> <span>Privasi</span></div>
            <div class="flex items-center gap-4 p-4 hover:bg-white/5 rounded-xl"><i class="fas fa-wallet"></i> <span>Saldo</span></div>
            <div class="flex items-center gap-4 p-4 hover:bg-white/5 rounded-xl"><i class="fas fa-qrcode"></i> <span>Kode QR</span></div>
            <div class="flex items-center gap-4 p-4 hover:bg-white/5 rounded-xl text-red-500"><i class="fas fa-sign-out-alt"></i> <span>Keluar</span></div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 h-[65px] bg-black border-t border-white/10 flex justify-around items-center z-[50]">
        <button onclick="switchTab('home')" class="nav-btn active flex flex-col items-center"><i class="fas fa-home text-lg"></i><span class="text-[9px] mt-1">Beranda</span></button>
        <button onclick="switchTab('friends')" class="nav-btn flex flex-col items-center"><i class="fas fa-users text-lg"></i><span class="text-[9px] mt-1">Teman</span></button>
        <div class="w-12 h-8 bg-gradient-to-r from-blue-400 via-white to-red-400 rounded-lg flex items-center justify-center"><i class="fas fa-plus text-black text-xs"></i></div>
        <button onclick="switchTab('inbox')" class="nav-btn flex flex-col items-center"><i class="fas fa-comment-dots text-lg"></i><span class="text-[9px] mt-1">Kotak masuk</span></button>
        <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center"><i class="fas fa-user text-lg"></i><span class="text-[9px] mt-1">Profil</span></button>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let session = JSON.parse(localStorage.getItem('vnio_tk_session')) || { 
            user: prompt("Username TikTok Kamu:") || "User", 
            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Math.random()}` 
        };
        localStorage.setItem('vnio_tk_session', JSON.stringify(session));

        // UI Logic
        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'home') document.getElementById('page-home').classList.add('active');
            if(tab === 'profile') document.getElementById('page-profile').classList.add('active');
            
            event.currentTarget.classList.add('active');
        }

        function toggleSettings() {
            const menu = document.getElementById('settings-menu');
            const overlay = document.getElementById('settings-overlay');
            menu.classList.toggle('show');
            overlay.classList.toggle('hidden');
        }

        // TIKTOK VIDEO OBSERVER (AUTO PLAY/PAUSE)
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play();
                } else {
                    video.pause();
                    video.currentTime = 0; // Reset video saat discroll jauh
                }
            });
        }, { threshold: 0.8 });

        // LOAD VIDEOS FROM FIREBASE (Use Bot-Tester to inject MP4 links)
        db.ref('global_videos').on('value', snap => {
            const feed = document.getElementById('tt-feed');
            const videos = snap.val();
            if(!videos) return feed.innerHTML = "<p class='text-center mt-20 text-zinc-500'>Beranda Kosong. Suntik video via Bot-Tester.</p>";
            
            feed.innerHTML = Object.values(videos).reverse().map(v => `
                <div class="tt-video-card">
                    <video src="${v.video}" loop playsinline></video>
                    <div class="absolute bottom-6 left-4 right-12">
                        <p class="font-bold text-sm">@${v.user}</p>
                        <p class="text-xs text-white/80 mt-1">Video inspirasi hari ini #fyp #vnioapp</p>
                    </div>
                    <div class="absolute right-3 bottom-10 flex flex-col gap-5 items-center">
                        <div class="w-12 h-12 rounded-full border border-white p-0.5 bg-black">
                            <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${v.user}" class="rounded-full">
                        </div>
                        <div class="text-center"><i class="fas fa-heart text-2xl"></i><p class="text-[10px] font-bold">${v.likes || 0}</p></div>
                        <div class="text-center"><i class="fas fa-comment text-2xl"></i><p class="text-[10px] font-bold">42</p></div>
                        <div class="text-center"><i class="fas fa-share text-2xl"></i><p class="text-[10px] font-bold">Bagikan</p></div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.tt-video-card').forEach(card => videoObserver.observe(card));
        });

        window.onload = () => {
            document.getElementById('user-display').innerText = session.user;
            document.getElementById('user-handle').innerText = session.user.toLowerCase();
            document.getElementById('profile-img').src = session.avatar;
        };
    </script>
</body>
</html>
