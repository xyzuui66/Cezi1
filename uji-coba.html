<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vnioapp Uji Coba - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b141d; color: #fff; height: 100dvh; overflow: hidden; }
        .ios-blur { background: rgba(23, 33, 43, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .tg-bubble { background: #182533; border-radius: 12px 12px 12px 0; max-width: 85%; animation: pop 0.2s ease; }
        .tg-bubble-me { background: #2b5278; border-radius: 12px 12px 0 12px; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .story-ring { border: 2px solid #3b82f6; padding: 2px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .page { display: none; height: 100%; overflow-y: auto; padding-bottom: 120px; }
        .page.active { display: block; }
        .video-card { aspect-ratio: 9/16; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-4 ios-blur border-b border-black z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="room-pfp" class="w-10 h-10 rounded-xl hidden object-cover border border-white/5">
            <div>
                <h1 id="room-name" class="text-sm font-black italic tracking-tighter">VNIO<span class="text-blue-400">LABS</span></h1>
                <p id="room-sub" class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">Global Network</p>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="openSettings()" id="btn-settings" class="hidden text-zinc-500"><i class="fas fa-cog"></i></button>
            <img id="my-pfp" class="w-9 h-9 rounded-full border border-white/10 object-cover">
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden">
        
        <section id="page-chat" class="page active">
            <div class="p-4 flex gap-4 overflow-x-auto hide-scroll bg-[#17212b]/50 border-b border-black">
                <div onclick="addStory()" class="flex-shrink-0 flex flex-col items-center gap-1">
                    <div class="w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center border-2 border-dashed border-zinc-700">
                        <i class="fas fa-plus text-xs text-zinc-500"></i>
                    </div>
                    <span class="text-[8px] font-bold text-zinc-500">Cerita</span>
                </div>
                <div id="story-container" class="flex gap-4"></div>
            </div>

            <div id="chat-feed" class="p-4 space-y-4 pb-32"></div>

            <div class="fixed bottom-20 left-0 right-0 p-4 bg-gradient-to-t from-[#0b141d] to-transparent">
                <div class="bg-[#17212b] p-2 rounded-2xl flex items-center gap-2 border border-white/5 shadow-2xl">
                    <button class="text-zinc-500 px-2"><i class="fas fa-paperclip"></i></button>
                    <input id="chat-input" type="text" placeholder="Tulis pesan..." class="flex-1 bg-transparent py-2 outline-none text-sm">
                    <button onclick="sendMsg()" class="bg-[#50a7ea] w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i class="fas fa-paper-plane text-xs text-white"></i>
                    </button>
                </div>
            </div>
        </section>

        <section id="page-video" class="page p-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-lg italic">GLOBAL <span class="text-blue-500">VIDS</span></h2>
                <button onclick="uploadVideo()" class="bg-[#2b5278] px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest">Upload</button>
            </div>
            <div id="video-grid" class="grid grid-cols-2 gap-4"></div>
        </section>

        <section id="page-groups" class="page p-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-lg italic text-blue-500 uppercase">Channels</h2>
                <button onclick="createNewGroup()" class="bg-zinc-800 px-4 py-2 rounded-xl text-[10px] font-bold">CREATE</button>
            </div>
            <div id="group-list" class="space-y-2"></div>
        </section>

    </main>

    <div id="modal-settings" class="fixed inset-0 z-[100] bg-black/95 hidden p-8 overflow-y-auto backdrop-blur-xl">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-10 text-blue-400">
                <h2 class="font-black uppercase tracking-widest">Metadata Lab</h2>
                <button onclick="closeSettings()"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="space-y-6">
                <div class="text-center">
                    <img id="edit-pp-preview" class="w-24 h-24 rounded-3xl mx-auto mb-4 object-cover border-2 border-white/10">
                    <input id="edit-pp-input" type="text" placeholder="URL PP Grup" class="w-full bg-[#17212b] p-4 rounded-2xl text-[10px] outline-none mb-4">
                </div>
                <input id="edit-name-input" type="text" placeholder="Nama Grup" class="w-full bg-[#17212b] p-4 rounded-2xl text-sm outline-none">
                <div class="bg-[#17212b] p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xs font-bold text-zinc-400">Hanya Admin Chat</span>
                    <input type="checkbox" id="check-admin-lock" class="w-5 h-5 accent-blue-500">
                </div>
                <button onclick="saveGroupSettings()" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-xs">Simpan Permanen</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 h-20 ios-blur border-t border-black flex justify-around items-center px-4">
        <button onclick="switchPage('chat'); switchRoom('global')" class="flex flex-col items-center text-blue-500"><i class="fas fa-comment-alt"></i><span class="text-[7px] font-black mt-1">CHATS</span></button>
        <button onclick="switchPage('video')" class="flex flex-col items-center text-zinc-500"><i class="fas fa-bolt"></i><span class="text-[7px] font-black mt-1">VIDS</span></button>
        <button onclick="switchPage('groups')" class="flex flex-col items-center text-zinc-500"><i class="fas fa-hashtag"></i><span class="text-[7px] font-black mt-1">GROUPS</span></button>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // PERSISTENT ACCOUNT
        let session = JSON.parse(localStorage.getItem('vnio_ultimate_session'));
        if(!session) {
            const n = prompt("Username Telegram:");
            session = { phone: "TG-" + Date.now(), user: n || "Anon", avatar: `https://api.dicebear.com/7.x/pixel-art/svg?seed=${n}` };
            localStorage.setItem('vnio_ultimate_session', JSON.stringify(session));
        }

        let currentRoom = 'global';
        let groupMeta = null;

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
        }

        function switchRoom(id) {
            currentRoom = id;
            db.ref('chats/' + id).off();
            if(id === 'global') {
                document.getElementById('room-pfp').classList.add('hidden');
                document.getElementById('room-name').innerText = "VNIO LABS";
                document.getElementById('btn-settings').classList.add('hidden');
            } else {
                db.ref('groups/metadata/' + id).on('value', snap => {
                    groupMeta = snap.val();
                    if(!groupMeta) return;
                    document.getElementById('room-pfp').src = groupMeta.pp;
                    document.getElementById('room-pfp').classList.remove('hidden');
                    document.getElementById('room-name').innerText = groupMeta.name;
                    document.getElementById('btn-settings').classList.remove('hidden');
                    
                    const isAdmin = groupMeta.admins && groupMeta.admins[session.phone];
                    document.getElementById('chat-input').disabled = (groupMeta.perms.send === 'admin' && !isAdmin);
                });
            }
            loadMessages(id);
        }

        function loadMessages(room) {
            db.ref('chats/' + room).limitToLast(50).on('value', snap => {
                const list = snap.val();
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = list ? Object.values(list).map(m => {
                    const isMe = m.phone === session.phone;
                    if(m.role === 'bot') return `<div class="flex justify-center my-4"><div class="bg-black/20 border border-blue-500/10 px-5 py-1 rounded-full text-[9px] text-blue-400 font-bold uppercase tracking-widest">${m.msg}</div></div>`;
                    return `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="tg-bubble ${isMe ? 'tg-bubble-me' : ''} p-2 px-3 shadow-xl">
                                <p class="text-[7px] font-black text-blue-400 mb-0.5 uppercase">${m.user} ${groupMeta?.admins?.[m.phone] ? '✓' : ''}</p>
                                <p class="text-[13px] leading-relaxed text-zinc-100">${m.msg}</p>
                            </div>
                        </div>`;
                }).join('') : "";
                feed.scrollTop = feed.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            db.ref('chats/' + currentRoom).push({ user: session.user, phone: session.phone, msg: inp.value, time: firebase.database.ServerValue.TIMESTAMP });
            inp.value = "";
        }

        // --- STORY & VIDEO LOGIC (NO PANGKAS) ---
        function addStory() {
            const url = prompt("URL Gambar Story:");
            if(url) db.ref('stories').push({ user: session.user, img: url, time: firebase.database.ServerValue.TIMESTAMP });
        }
        db.ref('stories').on('value', snap => {
            const container = document.getElementById('story-container');
            container.innerHTML = snap.val() ? Object.values(snap.val()).map(s => `<img src="${s.img}" class="w-14 h-14 rounded-full object-cover story-ring">`).join('') : "";
        });

        function uploadVideo() {
            const url = prompt("URL MP4 Video:");
            const d = prompt("Deskripsi:");
            if(url) db.ref('global_videos').push({ user: session.user, video: url, desc: d });
        }
        db.ref('global_videos').on('value', snap => {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = snap.val() ? Object.values(snap.val()).reverse().map(v => `<div class="video-card"><video src="${v.video}" class="w-full h-full object-cover" loop muted onclick="this.play()"></video></div>`).join('') : "";
        });

        // SETTINGS & GROUPS
        function openSettings() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('modal-settings').classList.add('hidden'); }
        function saveGroupSettings() {
            const up = { name: document.getElementById('edit-name-input').value, pp: document.getElementById('edit-pp-input').value, perms: { send: document.getElementById('check-admin-lock').checked ? 'admin' : 'all' } };
            db.ref('groups/metadata/' + currentRoom).update(up).then(() => closeSettings());
        }
        function createNewGroup() {
            const n = prompt("Nama Channel:");
            if(!n) return;
            const id = "grp_" + Date.now();
            const meta = { id, name: n, pp: "https://api.dicebear.com/7.x/shapes/svg?seed="+id, admins: {[session.phone]: true}, perms: {send: 'all'} };
            db.ref('groups/metadata/'+id).set(meta).then(() => switchRoom(id));
        }

        window.onload = () => { document.getElementById('my-pfp').src = session.avatar; switchRoom('global'); };
    </script>
</body>
</html>
