<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vnioapp Uji Coba - Fix Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0e1621; color: #fff; height: 100dvh; overflow: hidden; margin: 0; }
        .ios-blur { background: rgba(23, 33, 43, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .page { display: none; height: 100%; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: flex; flex-direction: column; }
        .tg-bubble { background: #182533; border-radius: 12px; padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .tg-bubble-me { background: #2b5278; align-self: flex-end; }
        
        /* TikTok Style Video */
        .tt-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - 160px); }
        .tt-video { scroll-snap-align: start; height: 100%; position: relative; background: #000; display: flex; align-items: center; }
        .tt-side { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body class="flex flex-col">

    <header class="p-4 tg-header flex justify-between items-center ios-blur border-b border-black z-50">
        <div class="flex items-center gap-3">
            <div id="back-btn" onclick="switchPage('groups')" class="hidden mr-2"><i class="fas fa-arrow-left"></i></div>
            <img id="room-pp" class="w-10 h-10 rounded-full hidden object-cover">
            <div>
                <h1 id="room-name" class="text-sm font-bold">VNIO LABS</h1>
                <p id="room-status" class="text-[10px] text-blue-400">online</p>
            </div>
        </div>
        <div class="flex gap-4">
            <i class="fas fa-search text-zinc-500"></i>
            <i onclick="openSettings()" id="set-icon" class="fas fa-cog text-zinc-500 hidden cursor-pointer"></i>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden">
        
        <section id="page-chat" class="page">
            <div id="chat-feed" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3"></div>
            <div id="input-area" class="p-2 bg-[#17212b] flex items-center gap-2">
                <i class="fas fa-paperclip text-zinc-500 px-2"></i>
                <input id="chat-input" type="text" placeholder="Pesan" class="flex-1 bg-transparent py-3 outline-none text-sm">
                <button onclick="sendMsg()" class="bg-[#50a7ea] w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fas fa-paper-plane text-white text-xs"></i>
                </button>
            </div>
        </section>

        <section id="page-groups" class="page active">
            <div class="p-4 flex gap-4 overflow-x-auto bg-[#17212b]/30 border-b border-black">
                <label class="flex-shrink-0 flex flex-col items-center gap-1 cursor-pointer">
                    <input type="file" accept="image/*" onchange="upStory(this)">
                    <div class="w-14 h-14 rounded-full border-2 border-dashed border-zinc-600 flex items-center justify-center text-zinc-500">
                        <i class="fas fa-plus"></i>
                    </div>
                    <span class="text-[8px] font-bold">Story</span>
                </label>
                <div id="story-list" class="flex gap-4"></div>
            </div>
            <div id="group-list" class="p-2 space-y-1"></div>
            <button onclick="createGrp()" class="fixed bottom-24 right-6 w-14 h-14 bg-[#50a7ea] rounded-full shadow-lg flex items-center justify-center text-white">
                <i class="fas fa-edit"></i>
            </button>
        </section>

        <section id="page-video" class="page">
            <div class="p-4 flex justify-between items-center ios-blur border-b border-black">
                <span class="font-black italic">GLOBAL FEED</span>
                <label class="bg-white text-black px-4 py-1 rounded-full text-[10px] font-bold cursor-pointer">
                    <input type="file" accept="video/*" onchange="upVideo(this)">
                    UPLOAD
                </label>
            </div>
            <div id="tt-feed" class="tt-container"></div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 ios-blur border-t border-black flex justify-around items-center">
        <button onclick="switchPage('groups')" class="flex flex-col items-center text-zinc-500" id="nav-home"><i class="fas fa-comment"></i><span class="text-[8px] mt-1">Chat</span></button>
        <button onclick="switchPage('video')" class="flex flex-col items-center text-zinc-500" id="nav-vid"><i class="fas fa-play-circle"></i><span class="text-[8px] mt-1">Video</span></button>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let session = JSON.parse(localStorage.getItem('vnio_fix_session')) || { phone: "USR-"+Date.now(), user: prompt("Username:") || "User", avatar: "https://api.dicebear.com/7.x/initials/svg?seed=vnio" };
        localStorage.setItem('vnio_fix_session', JSON.stringify(session));

        let currentRoom = '';

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            if(p === 'groups') {
                document.getElementById('back-btn').classList.add('hidden');
                document.getElementById('room-name').innerText = "VNIO LABS";
                document.getElementById('room-pp').classList.add('hidden');
            }
        }

        function switchRoom(id, name, pp) {
            currentRoom = id;
            switchPage('chat');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('room-name').innerText = name;
            document.getElementById('room-pp').src = pp;
            document.getElementById('room-pp').classList.remove('hidden');
            loadChats(id);
        }

        function createGrp() {
            const n = prompt("Nama Grup Baru:");
            if(!n) return;
            const id = "grp_" + Date.now();
            const pp = "https://api.dicebear.com/7.x/identicon/svg?seed=" + id;
            db.ref('groups/metadata/' + id).set({ id, name: n, pp, perms: {send:'all'}, admins: {[session.phone]: true} });
            switchRoom(id, n, pp); // Langsung masuk room
        }

        function loadChats(id) {
            db.ref('chats/' + id).on('value', snap => {
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = snap.val() ? Object.values(snap.val()).map(m => `
                    <div class="tg-bubble ${m.phone === session.phone ? 'tg-bubble-me' : ''}">
                        <p class="text-[9px] text-blue-400 font-bold">${m.user}</p>
                        <p class="text-sm">${m.msg}</p>
                    </div>
                `).join('') : '<p class="text-center text-zinc-600 text-xs mt-10">Belum ada pesan</p>';
                feed.scrollTop = feed.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if(!inp.value || !currentRoom) return;
            db.ref('chats/' + currentRoom).push({ user: session.user, phone: session.phone, msg: inp.value, time: firebase.database.ServerValue.TIMESTAMP });
            inp.value = "";
        }

        // --- STORY & TIKTOK SYSTEM (NATIVE FILE) ---
        function upStory(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                db.ref('stories').push({ user: session.user, img: e.target.result, time: firebase.database.ServerValue.TIMESTAMP });
                alert("Story Terkirim!");
            };
            reader.readAsDataURL(file);
        }

        function upVideo(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                db.ref('global_videos').push({ user: session.user, video: e.target.result, likes: 0 });
                alert("Video Berhasil di TikTok-kan!");
            };
            reader.readAsDataURL(file);
        }

        db.ref('stories').on('value', snap => {
            document.getElementById('story-list').innerHTML = snap.val() ? Object.values(snap.val()).map(s => `<img src="${s.img}" class="w-14 h-14 rounded-full border-2 border-blue-500 p-0.5 object-cover">`).join('') : '';
        });

        db.ref('global_videos').on('value', snap => {
            const feed = document.getElementById('tt-feed');
            feed.innerHTML = snap.val() ? Object.values(snap.val()).map(v => `
                <div class="tt-video">
                    <video src="${v.video}" class="w-full h-full object-contain" loop onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="tt-side">
                        <div class="text-center"><i class="fas fa-heart text-2xl"></i><p class="text-[10px] mt-1">${v.likes || 0}</p></div>
                        <div class="text-center"><i class="fas fa-comment text-2xl"></i><p class="text-[10px] mt-1">0</p></div>
                        <div class="text-center"><i class="fas fa-share text-2xl"></i></div>
                    </div>
                </div>
            `).join('') : '';
        });

        db.ref('groups/metadata').on('value', snap => {
            const list = document.getElementById('group-list');
            list.innerHTML = snap.val() ? Object.values(snap.val()).map(g => `
                <div onclick="switchRoom('${g.id}', '${g.name}', '${g.pp}')" class="flex items-center gap-4 p-3 hover:bg-white/5 cursor-pointer">
                    <img src="${g.pp}" class="w-12 h-12 rounded-full">
                    <div class="flex-1 border-b border-white/5 pb-2">
                        <p class="font-bold text-sm">${g.name}</p>
                        <p class="text-xs text-zinc-500">Ketuk untuk bergabung...</p>
                    </div>
                </div>
            `).join('') : '';
        });
    </script>
</body>
</html>
    <script>
        const firebaseConfig = { databaseURL: "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // PERSISTENT ACCOUNT
        let session = JSON.parse(localStorage.getItem('vnio_ultimate_session'));
        if(!session) {
            const n = prompt("Username Telegram:");
            session = { phone: "TG-" + Date.now(), user: n || "Anon", avatar: `https://api.dicebear.com/7.x/pixel-art/svg?seed=${n}` };
            localStorage.setItem('vnio_ultimate_session', JSON.stringify(session));
        }

        let currentRoom = 'global';
        let groupMeta = null;

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
        }

        function switchRoom(id) {
            currentRoom = id;
            db.ref('chats/' + id).off();
            if(id === 'global') {
                document.getElementById('room-pfp').classList.add('hidden');
                document.getElementById('room-name').innerText = "VNIO LABS";
                document.getElementById('btn-settings').classList.add('hidden');
            } else {
                db.ref('groups/metadata/' + id).on('value', snap => {
                    groupMeta = snap.val();
                    if(!groupMeta) return;
                    document.getElementById('room-pfp').src = groupMeta.pp;
                    document.getElementById('room-pfp').classList.remove('hidden');
                    document.getElementById('room-name').innerText = groupMeta.name;
                    document.getElementById('btn-settings').classList.remove('hidden');
                    
                    const isAdmin = groupMeta.admins && groupMeta.admins[session.phone];
                    document.getElementById('chat-input').disabled = (groupMeta.perms.send === 'admin' && !isAdmin);
                });
            }
            loadMessages(id);
        }

        function loadMessages(room) {
            db.ref('chats/' + room).limitToLast(50).on('value', snap => {
                const list = snap.val();
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = list ? Object.values(list).map(m => {
                    const isMe = m.phone === session.phone;
                    if(m.role === 'bot') return `<div class="flex justify-center my-4"><div class="bg-black/20 border border-blue-500/10 px-5 py-1 rounded-full text-[9px] text-blue-400 font-bold uppercase tracking-widest">${m.msg}</div></div>`;
                    return `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="tg-bubble ${isMe ? 'tg-bubble-me' : ''} p-2 px-3 shadow-xl">
                                <p class="text-[7px] font-black text-blue-400 mb-0.5 uppercase">${m.user} ${groupMeta?.admins?.[m.phone] ? '✓' : ''}</p>
                                <p class="text-[13px] leading-relaxed text-zinc-100">${m.msg}</p>
                            </div>
                        </div>`;
                }).join('') : "";
                feed.scrollTop = feed.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            db.ref('chats/' + currentRoom).push({ user: session.user, phone: session.phone, msg: inp.value, time: firebase.database.ServerValue.TIMESTAMP });
            inp.value = "";
        }

        // --- STORY & VIDEO LOGIC (NO PANGKAS) ---
        function addStory() {
            const url = prompt("URL Gambar Story:");
            if(url) db.ref('stories').push({ user: session.user, img: url, time: firebase.database.ServerValue.TIMESTAMP });
        }
        db.ref('stories').on('value', snap => {
            const container = document.getElementById('story-container');
            container.innerHTML = snap.val() ? Object.values(snap.val()).map(s => `<img src="${s.img}" class="w-14 h-14 rounded-full object-cover story-ring">`).join('') : "";
        });

        function uploadVideo() {
            const url = prompt("URL MP4 Video:");
            const d = prompt("Deskripsi:");
            if(url) db.ref('global_videos').push({ user: session.user, video: url, desc: d });
        }
        db.ref('global_videos').on('value', snap => {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = snap.val() ? Object.values(snap.val()).reverse().map(v => `<div class="video-card"><video src="${v.video}" class="w-full h-full object-cover" loop muted onclick="this.play()"></video></div>`).join('') : "";
        });

        // SETTINGS & GROUPS
        function openSettings() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('modal-settings').classList.add('hidden'); }
        function saveGroupSettings() {
            const up = { name: document.getElementById('edit-name-input').value, pp: document.getElementById('edit-pp-input').value, perms: { send: document.getElementById('check-admin-lock').checked ? 'admin' : 'all' } };
            db.ref('groups/metadata/' + currentRoom).update(up).then(() => closeSettings());
        }
        function createNewGroup() {
            const n = prompt("Nama Channel:");
            if(!n) return;
            const id = "grp_" + Date.now();
            const meta = { id, name: n, pp: "https://api.dicebear.com/7.x/shapes/svg?seed="+id, admins: {[session.phone]: true}, perms: {send: 'all'} };
            db.ref('groups/metadata/'+id).set(meta).then(() => switchRoom(id));
        }

        window.onload = () => { document.getElementById('my-pfp').src = session.avatar; switchRoom('global'); };
    </script>
</body>
</html>
