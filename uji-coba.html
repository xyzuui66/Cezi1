<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vnio TikTok Engine v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; height: 100dvh; overflow: hidden; margin: 0; }
        .tt-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: calc(100vh - 65px); }
        .tt-video-card { scroll-snap-align: start; height: calc(100vh - 65px); position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .page { display: none; height: 100%; overflow-y: auto; }
        .page.active { display: block; }
        .bottom-sheet { transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.show { transform: translateY(0); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .tab-active { border-bottom: 2px solid white; color: white !important; }
    </style>
</head>
<body>

    <main class="h-full">
        <section id="page-home" class="page active">
            <div id="tt-feed" class="tt-container hide-scroll"></div>
        </section>

        <section id="page-inbox" class="page bg-black">
            <div class="flex justify-around p-4 border-b border-white/10 text-zinc-500 font-bold text-sm">
                <button onclick="switchChatTab('global')" id="tab-global" class="tab-active pb-2 px-4">Global Chat</button>
                <button onclick="switchChatTab('friends')" id="tab-friends" class="pb-2 px-4">Teman</button>
            </div>
            
            <div id="chat-global-area" class="h-[calc(100vh-180px)] overflow-y-auto p-4 flex flex-col gap-3"></div>
            
            <div id="chat-friends-area" class="hidden h-[calc(100vh-180px)] overflow-y-auto p-4">
                <div class="flex gap-2 mb-6">
                    <input id="search-friend" type="text" placeholder="Masukkan username teman..." class="bg-zinc-900 flex-1 p-3 rounded-lg text-xs outline-none">
                    <button onclick="addFriend()" class="bg-blue-600 px-4 rounded-lg text-xs font-bold">Tambah</button>
                </div>
                <div id="friends-list" class="space-y-4"></div>
            </div>

            <div id="chat-input-bar" class="fixed bottom-[65px] left-0 right-0 bg-zinc-900 p-3 flex gap-2">
                <input id="msg-input" type="text" placeholder="Kirim pesan..." class="bg-transparent flex-1 outline-none text-xs">
                <button onclick="sendGlobalMsg()"><i class="fas fa-paper-plane text-blue-500"></i></button>
            </div>
        </section>

        <section id="page-profile" class="page">
             <div class="p-6 flex flex-col items-center mt-10">
                <img id="p-img" class="w-24 h-24 rounded-full border-2 border-white/10 mb-4 p-1">
                <p class="font-bold text-md mb-6">@<span id="p-handle">user</span></p>
                <div class="flex gap-8 mb-8">
                    <div class="text-center"><p id="stat-follow" class="font-extrabold">0</p><p class="text-[11px] text-zinc-500">Following</p></div>
                    <div class="text-center"><p id="stat-follower" class="font-extrabold">0</p><p class="text-[11px] text-zinc-500">Followers</p></div>
                </div>
                <button onclick="toggleSheet('settings-menu')" class="w-full mx-10 bg-zinc-900 py-3 rounded-md font-bold text-sm">Pengaturan Akun</button>
             </div>
        </section>
    </main>

    <div id="upload-overlay" class="fixed inset-0 bg-black z-[200] hidden flex flex-col p-6">
        <div class="flex justify-between items-center mb-6">
            <i onclick="closeUpload()" class="fas fa-times text-xl"></i>
            <span class="font-bold">Posting</span>
            <span></span>
        </div>
        <div class="flex gap-4">
            <div id="video-preview-box" class="w-24 h-36 bg-zinc-900 rounded-lg flex items-center justify-center overflow-hidden">
                <p class="text-[10px] text-zinc-600 text-center p-2">Video terpilih</p>
            </div>
            <textarea id="video-desc" class="flex-1 bg-transparent border-none outline-none text-sm resize-none" placeholder="Tulis deskripsi video..."></textarea>
        </div>
        <button onclick="finalPost()" class="mt-auto bg-[#fe2c55] py-3 rounded-md font-bold text-white">Posting Video</button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 h-[65px] bg-black border-t border-white/10 flex justify-around items-center z-[50]">
        <button onclick="switchTab('home')" class="flex flex-col items-center"><i class="fas fa-home text-lg"></i><span class="text-[9px] mt-1">Beranda</span></button>
        <button class="flex flex-col items-center text-zinc-600"><i class="fas fa-search text-lg"></i><span class="text-[9px] mt-1">Teman</span></button>
        
        <label class="w-12 h-8 bg-gradient-to-r from-cyan-400 via-white to-red-400 rounded-lg flex items-center justify-center cursor-pointer">
            <input type="file" accept="video/*" class="hidden" onchange="handleFileSelect(this)">
            <i class="fas fa-plus text-black text-xs"></i>
        </label>

        <button onclick="switchTab('inbox')" class="flex flex-col items-center"><i class="fas fa-comment-dots text-lg"></i><span class="text-[9px] mt-1">Inbox</span></button>
        <button onclick="switchTab('profile')" class="flex flex-col items-center"><i class="fas fa-user text-lg"></i><span class="text-[9px] mt-1">Profil</span></button>
    </nav>

    <script>
        const firebaseConfig = { databaseURL: "https://ceziroom-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let session = JSON.parse(localStorage.getItem('vnio_tk_v3')) || { uid: "TK-"+Date.now(), user: prompt("Username:") || "User", avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Math.random()}` };
        localStorage.setItem('vnio_tk_v3', JSON.stringify(session));

        // --- CHAT LOGIC ---
        function switchChatTab(type) {
            document.getElementById('tab-global').classList.toggle('tab-active', type === 'global');
            document.getElementById('tab-friends').classList.toggle('tab-active', type === 'friends');
            document.getElementById('chat-global-area').classList.toggle('hidden', type === 'friends');
            document.getElementById('chat-friends-area').classList.toggle('hidden', type === 'global');
            document.getElementById('chat-input-bar').classList.toggle('hidden', type === 'friends');
        }

        function sendGlobalMsg() {
            const msg = document.getElementById('msg-input').value;
            if(!msg) return;
            db.ref('global_chat').push({ user: session.user, msg: msg, time: Date.now() });
            document.getElementById('msg-input').value = "";
        }

        db.ref('global_chat').limitToLast(20).on('value', snap => {
            const area = document.getElementById('chat-global-area');
            const data = snap.val();
            area.innerHTML = data ? Object.values(data).map(m => `
                <div class="bg-zinc-900 p-3 rounded-xl max-w-[80%]">
                    <p class="text-[10px] text-blue-400 font-bold">@${m.user}</p>
                    <p class="text-xs text-white">${m.msg}</p>
                </div>
            `).join('') : "";
            area.scrollTop = area.scrollHeight;
        });

        // --- UPLOAD LOGIC (TIKTOK STYLE) ---
        let selectedVideoFile = null;

        function handleFileSelect(input) {
            if(input.files && input.files[0]) {
                selectedVideoFile = input.files[0];
                document.getElementById('upload-overlay').classList.remove('hidden');
                document.getElementById('video-preview-box').innerHTML = `<p class='text-[10px] text-green-500'>Video Siap!</p>`;
            }
        }

        function closeUpload() { document.getElementById('upload-overlay').classList.add('hidden'); }

        function finalPost() {
            const desc = document.getElementById('video-desc').value;
            const reader = new FileReader();
            reader.onload = (e) => {
                db.ref('global_videos').push({
                    user: session.user,
                    video: e.target.result,
                    desc: desc,
                    likes: 0,
                    time: Date.now()
                }).then(() => {
                    alert("Berhasil diposting!");
                    closeUpload();
                    switchTab('home');
                });
            };
            reader.readAsDataURL(selectedVideoFile);
        }

        // --- FEED & OTHER LOGIC (Sama seperti sebelumnya) ---
        function switchTab(t) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + t).classList.add('active');
        }

        // ... IntersectionObserver Logic tetap digunakan ...
    </script>
</body>
</html>
